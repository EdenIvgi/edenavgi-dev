services:
  - type: web
    runtime: static
    name: edenavgi-dev
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_RESEND_API_KEY
        sync: false
      - key: VITE_CONTACT_EMAIL
        sync: false
